version: '3.8'

services:
  api:
    build: .
    container_name: connecto_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/connecto
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/connecto
      - SECRET_KEY=connecto-super-secret-development-jwt-key-2026
      - SUPABASE_TRANSACTION_POOLER=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    container_name: connecto_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=connecto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d connecto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
