# ============================================================
#  Connecto Backend — GitHub Actions CI/CD Pipeline
#
#  Jobs:
#    1. lint-and-test  — Ruff lint + Pytest unit tests
#    2. docker-build   — Builds & pushes image to GHCR
#    3. deploy-render  — Triggers Render production deploy hook
#
#  Required GitHub Secrets:
#    CI_DATABASE_URL              — Postgres URL for the CI test DB (uses the job's postgres service)
#    CI_SYNC_DATABASE_URL         — Sync URL for the CI test DB
#    CI_SECRET_KEY                — Any 32+ char string for test JWT signing
#    RENDER_DEPLOY_HOOK_URL       — The Render deploy hook URL (from Render dashboard)
#
#  Required GitHub Variables (non-sensitive):
#    (none — all non-sensitive defaults come from the app itself)
# ============================================================

name: CI/CD — Connecto Backend

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/connecto-backend

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint + Unit Tests
  # ──────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Spin up a local Postgres for the test suite
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connecto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d connecto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # ---- Database (points at the CI service above) ----
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/connecto_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/connecto_test
      SUPABASE_TRANSACTION_POOLER: "False"

      # ---- App settings safe for CI ----
      ENVIRONMENT: testing
      DEBUG: "False"
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALGORITHM: HS256
      API_V1_STR: /api/v1
      PROJECT_NAME: "Connecto API (CI)"

      # ---- Razorpay stubs (no real calls in CI) ----
      RAZORPAY_KEY_ID: rzp_test_samplekey123
      RAZORPAY_KEY_SECRET: rzp_test_samplesecret456
      RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_789

      # ---- OAuth stub ----
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""

      # ---- SOS stub ----
      SMS_GATEWAY_API_KEY: ""
      EMERGENCY_DISPATCH_PHONE: "+910000000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Ruff (linter)
        run: pip install ruff

      - name: Run Ruff lint check
        # --exit-zero so lint warnings don't block CI — change to default if you want strict
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Run Pytest unit tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker Image to GHCR
  # Only runs on pushes to main/master (not PRs)
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract GHCR Docker metadata (tags + labels)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub Metadata
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/connecto-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Job 3: Deploy to Render
  # Triggers Render's deploy hook after the image is built
  # ──────────────────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
      url: https://connecto-api.onrender.com   # update with your actual Render URL

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is missing in GitHub repository settings. Skipping Render deploy hook trigger."
            echo "To enable auto-deploy, add RENDER_DEPLOY_HOOK_URL secret under Repo -> Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Triggering Render production deploy..."
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST \
            "$HOOK_URL")
          echo "Render deploy hook responded with HTTP $STATUS"
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 201 ]; then
            echo "::error::Render deploy hook returned unexpected status $STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully!"
